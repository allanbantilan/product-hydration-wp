name: aera-launch-local

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      AERA_MAILCHIMP_API_KEY: ${AERA_MAILCHIMP_API_KEY:-}
      AERA_MAILCHIMP_AUDIENCE_ID: ${AERA_MAILCHIMP_AUDIENCE_ID:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        ini_set('display_errors', '0');
        if (getenv('AERA_MAILCHIMP_API_KEY') && getenv('AERA_MAILCHIMP_AUDIENCE_ID')) {
            define('AERA_MAILCHIMP_API_KEY', getenv('AERA_MAILCHIMP_API_KEY'));
            define('AERA_MAILCHIMP_AUDIENCE_ID', getenv('AERA_MAILCHIMP_AUDIENCE_ID'));
        }
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/hydration-launch:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      AERA_MAILCHIMP_API_KEY: ${AERA_MAILCHIMP_API_KEY:-}
      AERA_MAILCHIMP_AUDIENCE_ID: ${AERA_MAILCHIMP_AUDIENCE_ID:-}
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/hydration-launch:ro

volumes:
  db_data:
  wp_data:
